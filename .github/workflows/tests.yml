name: Godot tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Run project tests
        run: ./scripts/run_tests.sh /tmp/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Verify room reconnect
        run: ./scripts/run_reconnect_integration.sh /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
