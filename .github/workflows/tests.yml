name: Godot tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Install CJK fonts
        # Card-layout tests render Chinese skill names; without a CJK font the
        # fallback line metrics are degenerate and the chip column overflows.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Build project cache (import + class scan)
        # Scene-mode runners on a fresh checkout need the .godot import cache
        # and global class list; without it every test process re-imports from
        # scratch and times out.
        run: /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --import --path .

      - name: Run project tests
        run: ./scripts/run_tests.sh /tmp/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Verify room reconnect
        run: ./scripts/run_reconnect_integration.sh /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
