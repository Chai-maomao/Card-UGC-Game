server {
    listen 443 ssl;
    server_name 103.236.54.24;
    ssl_certificate /etc/cardex-acme/live/103.236.54.24/fullchain.pem;
    ssl_certificate_key /etc/cardex-acme/live/103.236.54.24/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16m;
    access_log off;
    error_log /var/log/cardex-workshop-proxy-error.log warn;
    location ^~ /v1/admin/ { return 403; }
    location /v1/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    location / { return 404; }
}
